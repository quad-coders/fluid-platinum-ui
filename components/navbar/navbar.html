<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar — Fluid Platinum UI</title>
  <link rel="stylesheet" href="../../index.css">
</head>
<body style="padding: 2rem;">

  <h1 class="fp-ui-h2">Navbar</h1>
  <p class="fp-ui-text-lead">Sticky glass navigation bar. Brand auto-pushes nav items to the right.</p>

  <hr class="fp-ui-divider">

  <nav class="fp-ui-navbar" style="position: relative; margin-top: 1rem;" aria-label="Main navigation">
    <a class="fp-ui-navbar__brand" href="#!">FluidPlatinum</a>
    <ul class="fp-ui-navbar__nav">
      <li><a class="fp-ui-navbar__link fp-ui-navbar__link--active" href="#!">Dashboard</a></li>
      <li><a class="fp-ui-navbar__link" href="#!">Projects</a></li>
      <li><a class="fp-ui-navbar__link" href="#!">Settings</a></li>
    </ul>
  </nav>

  <!--
    USAGE:
    <nav class="fp-ui-navbar">
      <a class="fp-ui-navbar__brand" href="#!">Brand</a>
      <ul class="fp-ui-navbar__nav">
        <li><a class="fp-ui-navbar__link fp-ui-navbar__link--active" href="#!">Active</a></li>
        <li><a class="fp-ui-navbar__link" href="#!">Link</a></li>
      </ul>
    </nav>

    56px height, sticky by default. Use position: relative to disable sticky.
  -->

</body>
</html>
