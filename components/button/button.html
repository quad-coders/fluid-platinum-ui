<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button — Fluid Platinum UI</title>
  <link rel="stylesheet" href="../../index.css">
</head>
<body style="padding: 2rem;">

  <h1 class="fp-ui-h2">Button</h1>
  <p class="fp-ui-text-lead">Glassmorphic buttons with breathing glow, touch-ready sizing, and graceful state transitions.</p>

  <hr class="fp-ui-divider">

  <!-- Variants -->
  <h2 class="fp-ui-h4">Variants</h2>
  <div class="fp-ui-row fp-ui-gap-4" style="margin-top: 1rem;">
    <button class="fp-ui-btn fp-ui-btn--primary">Primary</button>
    <button class="fp-ui-btn fp-ui-btn--secondary">Secondary</button>
    <button class="fp-ui-btn fp-ui-btn--outline">Outline</button>
    <button class="fp-ui-btn fp-ui-btn--ghost">Ghost</button>
  </div>

  <!-- Sizes -->
  <h2 class="fp-ui-h4" style="margin-top: 2rem;">Sizes</h2>
  <p class="fp-ui-text-sm fp-ui-text-secondary">All sizes meet the 44px minimum touch target.</p>
  <div class="fp-ui-row fp-ui-gap-4 fp-ui-items-center" style="margin-top: 1rem;">
    <button class="fp-ui-btn fp-ui-btn--primary fp-ui-btn--sm">Small</button>
    <button class="fp-ui-btn fp-ui-btn--primary">Default</button>
    <button class="fp-ui-btn fp-ui-btn--primary fp-ui-btn--lg">Large</button>
  </div>

  <!-- Disabled -->
  <h2 class="fp-ui-h4" style="margin-top: 2rem;">Disabled</h2>
  <div class="fp-ui-row fp-ui-gap-4" style="margin-top: 1rem;">
    <button class="fp-ui-btn fp-ui-btn--primary" disabled>Disabled</button>
    <button class="fp-ui-btn fp-ui-btn--secondary" disabled>Disabled</button>
    <button class="fp-ui-btn fp-ui-btn--outline" disabled>Disabled</button>
  </div>

  <!--
    USAGE:
    <button class="fp-ui-btn fp-ui-btn--primary">Label</button>

    VARIANTS: --primary, --secondary, --ghost, --outline
    SIZES:    --sm, (default), --lg
    STATES:   :hover triggers animation, :active scales down, :disabled fades to 25%
  -->

</body>
</html>
