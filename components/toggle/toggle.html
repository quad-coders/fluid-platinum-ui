<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toggle — Fluid Platinum UI</title>
  <link rel="stylesheet" href="../../index.css">
</head>
<body style="padding: 2rem;">

  <h1 class="fp-ui-h2">Toggle</h1>
  <p class="fp-ui-text-lead">CSS-only switch via hidden checkbox. 44px touch target with glow when checked.</p>

  <hr class="fp-ui-divider">

  <div class="fp-ui-stack fp-ui-stack--sm" style="margin-top: 1rem;">
    <label class="fp-ui-toggle"><input type="checkbox" checked><span class="fp-ui-toggle__track"></span>Dark mode</label>
    <label class="fp-ui-toggle"><input type="checkbox"><span class="fp-ui-toggle__track"></span>Notifications</label>
    <label class="fp-ui-toggle"><input type="checkbox" checked><span class="fp-ui-toggle__track"></span>Auto-sync</label>
  </div>

  <!--
    USAGE:
    <label class="fp-ui-toggle">
      <input type="checkbox">
      <span class="fp-ui-toggle__track"></span>
      Label
    </label>
  -->

</body>
</html>
