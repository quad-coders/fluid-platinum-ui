<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breadcrumb — Fluid Platinum UI</title>
  <link rel="stylesheet" href="../../index.css">
</head>
<body style="padding: 2rem;">

  <h1 class="fp-ui-h2">Breadcrumb</h1>
  <p class="fp-ui-text-lead">Navigation trail with auto "/" separators via CSS sibling selector.</p>

  <hr class="fp-ui-divider">

  <nav aria-label="Breadcrumb" style="margin-top: 1rem;">
    <ol class="fp-ui-breadcrumb">
      <li class="fp-ui-breadcrumb__item"><a class="fp-ui-breadcrumb__link" href="#!">Home</a></li>
      <li class="fp-ui-breadcrumb__item"><a class="fp-ui-breadcrumb__link" href="#!">Projects</a></li>
      <li class="fp-ui-breadcrumb__item fp-ui-breadcrumb__item--current" aria-current="page">Fluid Platinum</li>
    </ol>
  </nav>

  <!--
    USAGE:
    <ol class="fp-ui-breadcrumb">
      <li class="fp-ui-breadcrumb__item"><a class="fp-ui-breadcrumb__link" href="#!">Home</a></li>
      <li class="fp-ui-breadcrumb__item fp-ui-breadcrumb__item--current" aria-current="page">Current</li>
    </ol>
  -->

</body>
</html>
